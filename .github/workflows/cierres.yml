name: Cierres de lote

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Carga histórica: primer día UTC (AAAA-MM-DD, vacío = anteayer a hoy)"
        required: false
      hasta:
        description: "Último día UTC (AAAA-MM-DD, vacío = hoy)"
        required: false

concurrency:
  group: epay-cierres
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cierres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      # Los valores del formulario pasan por variables de entorno (no dentro del comando) y el script los valida.
      - run: node src/index.js cierres $DESDE $HASTA
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EPAYUNO_USER: ${{ secrets.EPAYUNO_USER }}
          EPAYUNO_PASS: ${{ secrets.EPAYUNO_PASS }}
          NEPTUNO_USER: ${{ secrets.NEPTUNO_USER }}
          NEPTUNO_PASS: ${{ secrets.NEPTUNO_PASS }}
          EPAYUNO_API_TOKEN: ${{ secrets.EPAYUNO_API_TOKEN }}
          NEPTUNO_API_TOKEN: ${{ secrets.NEPTUNO_API_TOKEN }}
