name: Estatus de máquinas

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: epay-estatus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  estatus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node src/index.js estatus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EPAYUNO_USER: ${{ secrets.EPAYUNO_USER }}
          EPAYUNO_PASS: ${{ secrets.EPAYUNO_PASS }}
          NEPTUNO_USER: ${{ secrets.NEPTUNO_USER }}
          NEPTUNO_PASS: ${{ secrets.NEPTUNO_PASS }}
          EPAYUNO_API_TOKEN: ${{ secrets.EPAYUNO_API_TOKEN }}
          NEPTUNO_API_TOKEN: ${{ secrets.NEPTUNO_API_TOKEN }}
