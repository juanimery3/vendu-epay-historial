name: Cargar histórico

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer mes a cargar (AAAA-MM)"
        required: true
        default: "2026-07"
      hasta:
        description: "Último mes (AAAA-MM, vacío = mes actual)"
        required: false

concurrency:
  group: epay-ventas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      # Los valores del formulario pasan por variables de entorno (no dentro del comando) y el script los valida.
      - run: node src/index.js historico "$DESDE" $HASTA
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EPAYUNO_USER: ${{ secrets.EPAYUNO_USER }}
          EPAYUNO_PASS: ${{ secrets.EPAYUNO_PASS }}
          NEPTUNO_USER: ${{ secrets.NEPTUNO_USER }}
          NEPTUNO_PASS: ${{ secrets.NEPTUNO_PASS }}
